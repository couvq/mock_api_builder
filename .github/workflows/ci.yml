name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build workspace packages first: client and server import
      # @mock-api-builder/schema from its dist output.
      - run: pnpm build:packages

      # Prettier enforces code styling.
      - run: pnpm format:check

      # Linting passes.
      - run: pnpm lint

      # Type checks pass (tests included).
      - run: pnpm typecheck

      # Tests pass with coverage thresholds met.
      - run: pnpm test

      # Everything builds.
      - run: pnpm build:apps
